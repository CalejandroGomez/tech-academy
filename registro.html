<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro - Tech Academy</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet" />
</head>

<body class="pagina-registro">
  <header>
    <div class="logo">
      <img src="Images/Logo.png" alt="Logo Tech Academy" class="icono-pluma" />
      <div class="logo-text">
        <h1>TECH</h1>
        <h1>ACADEMY</h1>
      </div>
    </div>

    <nav>
      <a href="index.html">Inicio</a>
      <a href="index.html#programas">Programas</a>
      <a href="index.html#contacto">Contacto</a>
      <a href="login.html">Ingresar</a>
      <img src="Images/UserShield.png" alt="Usuario" class="user-icon" />
    </nav>
  </header>

  <main class="contenido-registro">
    <section class="tarjeta-registro">
      <form class="formulario-registro" id="form-registro">
        <div class="grupo-registro">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" name="nombre" placeholder="Nombre completo" />
        </div>

        <div class="grupo-registro">
          <label for="documento">Documento</label>
          <input type="text" id="documento" name="documento" placeholder="Número documento" />
        </div>

        <div class="grupo-registro">
          <label for="correo">Correo</label>
          <input type="email" id="correo" name="correo" placeholder="t_a@email.com" />
        </div>

        <div class="grupo-registro">
          <label for="telefono">Teléfono</label>
          <input type="tel" id="telefono" name="telefono" placeholder="Número de contacto" />
        </div>

        <div class="grupo-registro">
          <label for="contrasena-registro">Contraseña</label>
          <input type="password" id="contrasena-registro" name="contrasena" placeholder="Contraseña" />
        </div>

        <button type="submit" class="boton-registro">Registrarse</button>

        <div id="mensaje-registro" class="mensaje-registro"></div>
      </form>
    </section>

    <div class="decoracion-registro">
      <img src="Images/estudianteH.png" alt="Aprendiz" class="estudianteHombre" />
    </div>
  </main>

  <script src="js/registro.js"></script>
</body>

</html>
